quarkus.http.port=8080
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
# quarkus.log.console.json=true  # requires quarkus-logging-json extension, not installed
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=6
quarkus.flyway.baseline-description=Baseline-v2-tables-exist
quarkus.oidc.application-type=service
quarkus.oidc.discovery-enabled=true
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8443/realms/abax-memory}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:abax-memory-api}
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET:ZN8NB5raPHtfYozXLVrEGnbBdXI48BTI}
abax.processing.auto-run=false
abax.processing.batch-size=10
abax.processing.retry-delay=PT30S
abax.processing.max-retries=3

# OpenAI configuration (via langchain4j quarkiverse extension)
# API key loaded from environment variable - NEVER hardcoded
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-large
quarkus.langchain4j.openai.embedding-model.dimensions=3072
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.timeout=90s

# Qdrant configuration
abax.qdrant.host=${ABAX_QDRANT_HOST:localhost}
abax.qdrant.port=${ABAX_QDRANT_PORT:6333}
abax.qdrant.collection=${ABAX_QDRANT_COLLECTION:abax-memories}
abax.qdrant.vector-size=3072
abax.qdrant.use-tls=${ABAX_QDRANT_USE_TLS:false}

# Validation model (more powerful for critical validation)
abax.openai.validation-model=${ABAX_OPENAI_VALIDATION_MODEL:gpt-4o}

# ═══════════════════════════════════════════════════════════
# Abax-Memory v2.0.0 Configuration
# ═══════════════════════════════════════════════════════════

# Hibernate ORM — scan both v1 and v2 entity packages
quarkus.hibernate-orm.packages=com.btl.administrador,com.abax.memory

# ── Qdrant v2 ──
abax.v2.qdrant.host=${ABAX_V2_QDRANT_HOST:localhost}
abax.v2.qdrant.port=${ABAX_V2_QDRANT_PORT:6333}
abax.v2.qdrant.collection=${ABAX_V2_QDRANT_COLLECTION:abax-memories-v2}
abax.v2.qdrant.vector-size=${ABAX_V2_QDRANT_VECTOR_SIZE:3072}
abax.v2.qdrant.use-tls=${ABAX_V2_QDRANT_USE_TLS:false}
abax.v2.qdrant.api-key=${ABAX_V2_QDRANT_API_KEY:}
abax.v2.qdrant.mock=${ABAX_V2_QDRANT_MOCK:false}

# ── OpenAI Embeddings v2 (abstracted behind EmbeddingProvider) ──
abax.v2.openai.api-key=${OPENAI_API_KEY}
abax.v2.openai.embedding-model=${ABAX_V2_OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
abax.v2.openai.embedding-dimensions=${ABAX_V2_OPENAI_EMBEDDING_DIMENSIONS:3072}
abax.v2.openai.base-url=${ABAX_V2_OPENAI_BASE_URL:https://api.openai.com/v1}
abax.v2.openai.timeout-seconds=${ABAX_V2_OPENAI_TIMEOUT_SECONDS:90}

# ── OIDC / Keycloak v2 (reuses v1 realm) ──
abax.v2.oidc.auth-server-url=${ABAX_V2_OIDC_AUTH_SERVER_URL:http://localhost:8443/realms/abax-memory}
abax.v2.oidc.client-id=${ABAX_V2_OIDC_CLIENT_ID:abax-memory-api}
abax.v2.oidc.credentials.secret=${ABAX_V2_OIDC_CREDENTIALS_SECRET:}

# ── Processing v2 ──
abax.v2.processing.auto-run=${ABAX_V2_PROCESSING_AUTO_RUN:true}
abax.v2.processing.batch-size=${ABAX_V2_PROCESSING_BATCH_SIZE:10}
abax.v2.processing.retry-delay=${ABAX_V2_PROCESSING_RETRY_DELAY:PT30S}
abax.v2.processing.max-retries=${ABAX_V2_PROCESSING_MAX_RETRIES:3}

# ── Validation v2 ──
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.fail-on-empty-beans=false

# ── OpenAPI v2 ──
quarkus.smallrye-openapi.info-title=Abax-Memory v2 API
quarkus.smallrye-openapi.info-version=2.0.0
quarkus.smallrye-openapi.info-description=Generic Memory Engine — Multi-Domain AI-powered Memory API

%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:abax-memory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.hibernate-orm.database.generation=validate
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.langchain4j.openai.api-key=test-key-not-used-in-tests
%test.abax.qdrant.host=localhost
%test.abax.qdrant.port=6334
%test.abax.qdrant.vector-size=3072
%test.abax.v2.llm.mock=true
