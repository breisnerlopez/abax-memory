quarkus.oidc.enabled=false
quarkus.http.test-port=0
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.jdbc.url=jdbc:h2:mem:abax-memory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE\;
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true

# OpenAI config for tests (non-functional key, tests should mock these services)
quarkus.langchain4j.openai.api-key=test-key-not-used
quarkus.langchain4j.openai.timeout=5s
abax.qdrant.host=localhost
abax.qdrant.port=6334
abax.qdrant.vector-size=3072
abax.openai.validation-model=gpt-4o

# v2 config: force mock Qdrant for unit tests (InMemoryEmbeddingProvider produces 64-dim vectors)
abax.v2.qdrant.mock=true

# v2 config: force mock LLM for unit tests (MockLlmService produces deterministic responses)
# This avoids OpenAI API timeouts and network calls during CI/CD builds
abax.v2.llm.mock=true
